default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-ast
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: "1.8.6"
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-ll", "-x", "./tests"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

#   - repo: https://github.com/djlint/djLint
#     rev: v1.36.4
#     hooks:
#       - id: djlint-reformat-django
#       - id: djlint-django

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # The bundled fls-content validator is passed explicitly: mypy's recursive crawl skips
        # claude_plugins/fls-content/ because the directory name is not a valid Python identifier.
        entry: uv run mypy . claude_plugins/fls-content/validate
        language: system
        types: [python]
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        require_serial: true
      - id: app-map-fresh
        name: app-map-fresh
        entry: uv run python claude_plugins/django-stack/scripts/generate_app_map.py --check
        language: system
        pass_filenames: false
        require_serial: true
      - id: lint-imports
        name: lint-imports
        entry: uv run lint-imports --config test_organisation/import_contracts.toml
        language: system
        pass_filenames: false
        require_serial: true
      - id: test-mirroring
        name: test-mirroring
        entry: uv run python claude_plugins/django-stack/scripts/check_test_mirroring.py
        language: system
        pass_filenames: false
        require_serial: true
