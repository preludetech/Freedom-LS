name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

# No job writes to the repository; artifacts need no extra scope.
permissions:
  contents: read

# Every run tests one commit for someone waiting on its verdict, so none cancels another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  UNIT_MARKERS: not playwright
  BROWSER_MARKERS: playwright
  SPLIT_FLAGS: --splitting-algorithm least_duration --durations-path .test_durations

jobs:
  lint:
    name: Lint
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run python claude_plugins/django-stack/scripts/generate_app_map.py --check
      - run: uv run lint-imports --config test_organisation/import_contracts.toml
      - run: uv run python claude_plugins/django-stack/scripts/check_test_mirroring.py

  type-check:
    name: Type check
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync
      - run: uv run mypy .
        env:
          DJANGO_SETTINGS_MODULE: config.settings_dev

  unit-tests:
    name: unit-${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fls_dev
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db
        ports:
          - 6543:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run tailwind_build

      - name: Install the WeasyPrint system libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2 libgdk-pixbuf-2.0-0

      - name: Run tests
        env:
          DS_TEST_RECORD_PATH: ${{ runner.temp }}/group-report.jsonl
          COVERAGE_FILE: .coverage.unit-${{ matrix.group }}
        run: >-
          .claude/ds/scripts/run_tests.sh uv run pytest -n auto -m "$UNIT_MARKERS"
          --splits ${{ strategy.job-total }} --group ${{ matrix.group }} $SPLIT_FLAGS
          --randomly-seed=${{ github.run_id }} --tb=short --cov

      - name: Upload group report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: group-report-unit-${{ matrix.group }}
          path: ${{ runner.temp }}/group-report.jsonl
          if-no-files-found: ignore

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ matrix.group }}
          path: .coverage.unit-${{ matrix.group }}*
          include-hidden-files: true
          if-no-files-found: ignore

  playwright-tests:
    name: playwright-${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fls_dev
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 6543:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run tailwind_build

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        env:
          DS_TEST_RECORD_PATH: ${{ runner.temp }}/group-report.jsonl
        run: >-
          .claude/ds/scripts/run_tests.sh uv run pytest -n auto -m "$BROWSER_MARKERS"
          --splits ${{ strategy.job-total }} --group ${{ matrix.group }} $SPLIT_FLAGS
          --randomly-seed=${{ github.run_id }} --tb=short

      - name: Upload group report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: group-report-playwright-${{ matrix.group }}
          path: ${{ runner.temp }}/group-report.jsonl
          if-no-files-found: ignore

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.group }}
          path: test-results/
          retention-days: 7

  standalone-tests:
    name: standalone-${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [panel_framework, icons]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fls_dev
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db
        ports:
          - 6543:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run tailwind_build

      # Each standalone config carries its own marker expression, so neither marker variable applies.
      - name: Run tests
        env:
          DS_TEST_RECORD_PATH: ${{ runner.temp }}/group-report.jsonl
        run: >-
          .claude/ds/scripts/run_tests.sh uv run pytest
          -c freedom_ls/${{ matrix.app }}/tests/standalone_pytest.ini freedom_ls/${{ matrix.app }}/tests
          --randomly-seed=${{ github.run_id }} --tb=short

      - name: Upload group report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: group-report-standalone-${{ matrix.app }}
          path: ${{ runner.temp }}/group-report.jsonl
          if-no-files-found: ignore

  coverage:
    needs: unit-tests
    if: always()
    runs-on: ubuntu-24.04
    env:
      COVERAGE_FAIL_UNDER: 92
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync

      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-unit-*
          path: coverage-data/

      - name: Check every group's coverage data is present
        # Same count as the unit-tests matrix; tests/test_tests_workflow.py keeps the two equal.
        env:
          UNIT_GROUP_COUNT: 6
        run: |
          for k in $(seq 1 "$UNIT_GROUP_COUNT"); do
            ls coverage-data/coverage-unit-$k/.coverage.unit-$k* >/dev/null || { echo "coverage data missing for unit-$k"; exit 1; }
          done

      - name: Combine coverage
        run: uv run coverage combine coverage-data/*/ && uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Write coverage total
        run: printf 'total=%s\nfail_under=%s\n' "$(uv run coverage report --format=total)" "$COVERAGE_FAIL_UNDER" > coverage_total.txt

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-total
          path: coverage_total.txt

      - name: Check combined coverage
        run: uv run coverage report --fail-under="$COVERAGE_FAIL_UNDER"

  test-verdict:
    needs: [unit-tests, playwright-tests, standalone-tests, coverage]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fls_dev
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db
        ports:
          - 6543:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run tailwind_build

      - uses: actions/download-artifact@v7
        with:
          pattern: group-report-*
          path: group-reports/

      - name: Check every test job succeeded
        if: always()
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success")' <<<"$RESULTS" >/dev/null || { echo "test-verdict: a needed job did not succeed"; exit 1; }

      # Each pool's group reports must together hold exactly the tests a fresh collection finds,
      # each once, so a group given the wrong split count cannot hide a test.
      - name: Check the partition
        if: always()
        run: |
          uv run pytest --collect-only -q -m "$UNIT_MARKERS" --randomly-seed=${{ github.run_id }} > unit_collection.txt
          uv run pytest --collect-only -q -m "$BROWSER_MARKERS" --randomly-seed=${{ github.run_id }} > browser_collection.txt
          uv run python claude_plugins/fls-dev/scripts/check_test_partition.py --collection unit_collection.txt group-reports/group-report-unit-*/group-report.jsonl
          uv run python claude_plugins/fls-dev/scripts/check_test_partition.py --collection browser_collection.txt group-reports/group-report-playwright-*/group-report.jsonl
