<div class="flex min-w-0 items-center gap-2">
    {% if object.kind != "course" %}
        <span class="shrink-0 text-muted">
            <c-icon name="{{ object.icon }}" class="size-4" />
            <span class="sr-only">{{ object.kind_label }}</span>
        </span>
    {% endif %}
    <span class="min-w-0 font-medium break-words">{{ object.title }}</span>
    {% if object.retired %}<c-panel-status-badge label="Retired" class="shrink-0" data-testid="retired-badge" />{% endif %}
</div>
