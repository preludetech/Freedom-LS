{% comment %}
The three steps of a learner import. Context: step (1, 2 or 3).
{% endcomment %}
<nav aria-label="Import steps">
    <p class="text-sm text-muted">Step {{ step }} of 3</p>
    <ol class="mt-1 ml-0 flex list-none gap-4 space-y-0 text-sm">
        <li {% if step == 1 %}aria-current="step" class="font-semibold"{% endif %}>1. Upload</li>
        <li {% if step == 2 %}aria-current="step" class="font-semibold"{% endif %}>2. Preview</li>
        <li {% if step == 3 %}aria-current="step" class="font-semibold"{% endif %}>3. Result</li>
    </ol>
</nav>
