{% comment %}
The modal fragment a ReactivateMemberAction's GET returns. Context: member,
roles (a prose list of the roles that take effect again), confirm_url.
{% endcomment %}
<c-modal-header>Reactivate {{ member.display_name }}</c-modal-header>

<div class="space-y-3 px-6 py-4 text-sm">
    <p>These roles take effect again: {{ roles }}.</p>
</div>

<c-button-group variant="right" class="flex-wrap border-t border-border px-6 py-4">
    <c-button variant="secondary" x-on:click="requestClose" autofocus>Cancel</c-button>
    <form hx-post="{{ confirm_url }}"
          hx-target="#app-modal-body"
          hx-swap="innerHTML"
          hx-disabled-elt="find button[type='submit']">
        <input type="hidden" name="user" value="{{ member.pk }}">
        <c-button type="submit" variant="secondary" loading="true" loading_text="Reactivating...">
            Reactivate
        </c-button>
    </form>
</c-button-group>
