{% comment %}
The modal fragment a ReactivateLearnerAction's GET returns. Context: learner,
action_url.
{% endcomment %}
<c-modal-header>Reactivate {{ learner.user.display_name }}</c-modal-header>

<div class="space-y-3 px-6 py-4 text-sm">
    <p>{{ learner.user.display_name }}'s access returns through their existing cohorts and registrations.</p>
</div>

<c-button-group variant="right" class="flex-wrap border-t border-border px-6 py-4">
    <c-button variant="secondary" x-on:click="requestClose" autofocus>Cancel</c-button>
    <form hx-post="{{ action_url }}"
          hx-target="#app-modal-body"
          hx-swap="innerHTML"
          hx-disabled-elt="find button[type='submit']">
        <c-button type="submit" variant="secondary" loading="true" loading_text="Reactivating...">
            Reactivate
        </c-button>
    </form>
</c-button-group>
