{% extends "panel_framework/panels/panel.html" %}

{% block panel_body %}
    <c-panel-definition-list>
        <c-panel-definition-row label="Name">{{ learner.user.display_name }}</c-panel-definition-row>
        <c-panel-definition-row label="Email">{{ learner.user.email }}</c-panel-definition-row>
        <c-panel-definition-row label="Status"><c-panel-status-badge :badge="status_badge" /></c-panel-definition-row>
        <c-panel-definition-row label="Date added"><c-date :value="learner.created_at" /></c-panel-definition-row>
    </c-panel-definition-list>
{% endblock panel_body %}
