{% extends "panel_framework/panels/panel.html" %}

{% block panel_body %}
    {% if educators %}
        <ul class="m-0 list-none divide-y divide-border p-0">
            {% for user, role in educators %}
                <li class="flex items-center justify-between gap-3 py-2">
                    <c-panel-avatar-chip name="{{ user.display_name }}" user_id="{{ user.pk }}" secondary="{% if user.first_name or user.last_name %}{{ user.email }}{% endif %}" class="min-w-0" />
                    <span class="shrink-0 text-sm text-muted">{{ role }}</span>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <c-panel-empty-state message="No educators assigned to this cohort." />
    {% endif %}
{% endblock panel_body %}
