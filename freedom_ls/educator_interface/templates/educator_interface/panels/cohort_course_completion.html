{% extends "panel_framework/panels/panel.html" %}

{% block panel_body %}
    {% if completions %}
        <c-panel-list>
            {% for entry in completions %}
                <c-panel-list-row :title="entry.course.title" detail="{{ entry.completed_count }} of {{ entry.record_count }} completed">
                    <div class="w-32"><c-panel-progress-bar percentage="{{ entry.percentage }}" label="{{ entry.course.title }} completion" /></div>
                </c-panel-list-row>
            {% endfor %}
        </c-panel-list>
    {% else %}
        <c-panel-empty-state message="No courses registered." />
    {% endif %}
{% endblock panel_body %}
