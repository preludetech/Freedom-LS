{% extends "panel_framework/panels/panel.html" %}

{% block panel_body %}
    <c-panel-definition-list>
        <c-panel-definition-row label="Name">{{ cohort.name }}</c-panel-definition-row>
        <c-panel-definition-row label="Status"><c-panel-status-badge :badge="status_badge" /></c-panel-definition-row>
        <c-panel-definition-row label="Created"><c-date :value="cohort.created_at" /></c-panel-definition-row>
        <c-panel-definition-row label="Learners">{{ cohort_learner_count }}</c-panel-definition-row>
        <c-panel-definition-row label="Courses">{{ cohort_course_count }}</c-panel-definition-row>
    </c-panel-definition-list>
{% endblock panel_body %}
