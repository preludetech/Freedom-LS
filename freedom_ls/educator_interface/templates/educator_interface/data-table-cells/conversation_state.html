{% comment %}
The unread marker and the Read only chip. Both can show at once: a closed
conversation can still hold messages the educator has not read.
{% endcomment %}
<span class="inline-flex flex-wrap items-center gap-2">
    {% if object.conversation.is_unread %}
        <span class="inline-flex items-center gap-1 text-xs font-semibold text-primary">
            <span class="size-2 rounded-full bg-primary" aria-hidden="true"></span>
            Unread
        </span>
    {% endif %}
    {% if not object.can_reply %}
        <c-chip variant="muted" size="xs" icon="locked">Read only</c-chip>
    {% endif %}
</span>
