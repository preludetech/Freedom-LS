<c-vars option_text="" wrong_choice="" class="" />
{% comment %}
Marks the correct option, or the learner's wrong choice, for a reviewer. The
words carry the meaning either way, so the mark reads without colour.
{% endcomment %}
{% if wrong_choice %}<span class="flex shrink-0 items-center gap-1 text-sm text-error {{ class }}"><c-icon name="error" class="size-4" />Your answer</span>{% else %}<span class="flex shrink-0 items-center gap-1 text-sm text-success {{ class }}"><c-icon name="check" class="size-4" />Correct answer{% if option_text %}: {{ option_text }}{% endif %}</span>{% endif %}
