{% comment %}
The modal fragment a confirmed bulk action returns, replacing the
confirmation in #app-modal. Context: action, result, noun, headline,
result_lines.
{% endcomment %}
<c-modal-header>{{ action.label }}</c-modal-header>

<c-modal-body>
{% include "panel_framework/partials/bulk_result_body.html" %}
</c-modal-body>

<c-modal-footer cancel="Close" focus_cancel="true" cancel_describedby="bulk-result-headline" />
<div hx-swap-oob="innerHTML:#app-modal-status">{{ headline }}</div>
