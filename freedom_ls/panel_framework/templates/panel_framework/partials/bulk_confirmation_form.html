{% if not error %}
    {% querystring request.GET as qs %}
    <form method="post"
          action="{{ action_url }}{{ qs }}"
          hx-post="{{ action_url }}{{ qs }}"
          hx-target="#app-modal-body"
          hx-swap="innerHTML"
          hx-disabled-elt="find button[type='submit']">
        {% csrf_token %}
        <input type="hidden" name="mode" value="{{ selection.mode }}">
        {% for key in selection.keys %}
            <input type="hidden" name="keys" value="{{ key }}">
        {% endfor %}
        {% for key in selection.excluded %}
            <input type="hidden" name="excluded" value="{{ key }}">
        {% endfor %}
        <input type="hidden" name="expected_count" value="{{ expected_count }}">
        <input type="hidden" name="confirmed" value="1">
        <c-button type="submit" variant="{{ action.variant }}" loading="true" :disabled="confirm_disabled">{{ action.label }}</c-button>
    </form>
{% endif %}
