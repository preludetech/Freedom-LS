{% comment %}
The mobile filter sheet: a plain GET form inside base's shared
bottom-sheet dialog, reachable and submittable below md with JavaScript off
via the scripting-none override below. A <noscript> would leak into the page
when htmx swaps this fragment in.
{% endcomment %}
<dialog id="{{ query.key }}-sheet"
        x-ref="panelDialog"
        data-variant="bottom-sheet"
        class="side-panel-dialog modal-backdrop-host bg-transparent md:hidden"
        aria-label="Filter">
    <div class="side-panel-body bg-surface bottom-sheet overflow-y-auto overscroll-contain">
        <form method="get"
              action="{{ page_url }}"
              hx-get="{{ base_url }}"
              hx-target="#{{ region_id }}"
              hx-swap="outerHTML"
              class="flex flex-col gap-4 p-4">
            {% for name, value in sheet_hidden_inputs %}
                <input type="hidden" name="{{ name }}" value="{{ value }}">
            {% endfor %}

            {# The same header as the quick view: the title, then the controls, the close at the end. #}
            <div class="flex items-center gap-1">
                <h2 class="flex-1 min-w-0 text-lg font-semibold">Filter</h2>
                {% querystring request.GET reset_changes as reset_qs %}
                <c-button variant="link" size="small" class="min-w-11"
                          href="{{ page_url }}{{ reset_qs }}"
                          hx-get="{{ base_url }}{{ reset_qs }}"
                          hx-target="#{{ region_id }}"
                          hx-swap="outerHTML">Reset</c-button>
                <c-panel-close-button />
            </div>

            {% for entry in toolbar %}
                {% if entry.filter.widget == "select" %}
                    <label class="flex flex-col gap-1">
                        <span class="text-xs font-semibold uppercase tracking-wide text-muted">{{ entry.filter.label }}</span>
                        <select name="{{ query.key }}-{{ entry.filter.key }}">
                            {% if not entry.filter.default %}<option value="">All</option>{% endif %}
                            {% for choice in entry.choices %}
                                <option value="{{ choice.value }}" {% if choice.selected %}selected{% endif %}>
                                    {{ choice.label }}
                                </option>
                            {% endfor %}
                        </select>
                    </label>
                {% elif entry.filter.widget == "grouped_checklist" %}
                    <fieldset class="space-y-2 border-0 p-0">
                        <legend class="px-0 text-xs font-semibold uppercase tracking-wide text-muted">{{ entry.filter.label }}</legend>
                        {% for group in entry.groups %}
                            <details class="group rounded-md border border-border">
                                <summary class="list-none marker:hidden [&::-webkit-details-marker]:hidden flex min-h-11 cursor-pointer items-center justify-between gap-2 px-3 py-2 text-sm font-semibold">
                                    {{ group.label|default:entry.filter.label }}
                                    <c-icon name="dropdown" class="size-4 text-muted group-open:rotate-180" />
                                </summary>
                                <div class="space-y-1 px-3 pb-2">
                                    {% for choice in group.choices %}
                                        <label class="flex min-h-11 cursor-pointer items-center gap-2 text-sm font-normal text-on-surface">
                                            <input type="checkbox" name="{{ query.key }}-{{ entry.filter.key }}" value="{{ choice.value }}" {% if choice.selected %}checked{% endif %}>
                                            {{ choice.label }}
                                        </label>
                                    {% endfor %}
                                </div>
                            </details>
                        {% endfor %}
                    </fieldset>
                {% else %}
                    <fieldset class="space-y-2 border-0 p-0">
                        <legend class="px-0 text-xs font-semibold uppercase tracking-wide text-muted">{{ entry.filter.label }}</legend>
                        <div class="flex flex-wrap gap-2">
                            {% for choice in entry.choices %}
                                <label class="relative inline-flex min-h-11 cursor-pointer items-center gap-1 rounded-full border border-border px-3 py-1 text-sm has-[:checked]:border-primary has-[:checked]:bg-primary has-[:checked]:text-on-primary">
                                    <input type="checkbox"
                                           name="{{ query.key }}-{{ entry.filter.key }}"
                                           value="{{ choice.value }}"
                                           {% if choice.selected %}checked{% endif %}
                                           class="sr-only">
                                    {{ choice.label }}
                                </label>
                            {% endfor %}
                        </div>
                    </fieldset>
                {% endif %}
            {% endfor %}


            <c-modal-footer cancel_click="close" class="mt-auto -mx-4 -mb-4">
                <c-button type="submit" variant="primary">Show results</c-button>
            </c-modal-footer>
        </form>
    </div>
</dialog>
<style>
    @media (scripting: none) {
        #{{ query.key }}-sheet {
            display: block;
            position: static;
            opacity: 1;
            transform: none;
        }
    }
</style>
