{% comment %}
Context: action, action_url, selection, count, noun, error, modal_open.
{% endcomment %}
<c-modal title="{{ action.label }}" open="{{ modal_open|default:'false' }}">
    {% include "panel_framework/partials/bulk_confirmation_message.html" %}

    <c-slot name="footer">
        <c-button variant="secondary" @click="close">Cancel</c-button>
        {% include "panel_framework/partials/bulk_confirmation_form.html" %}
    </c-slot>
</c-modal>
