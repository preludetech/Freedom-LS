{% extends "allauth/layouts/manage.html" %}
{% load i18n %}
{% load allauth account %}

{% block head_title %}Profile{% endblock %}
{% block content %}

<h1>
    Profile
</h1>

<c-panel-avatar-chip size="lg" :name="request.user.display_name" :initials="request.user.initials" :user_id="request.user.pk" :picture_url="request.user.profile_picture_url" />

<form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{form}}

        <c-button type="submit">
            Save
        </c-button>

</form>



{% endblock content %}
