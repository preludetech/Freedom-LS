{% comment %}Stretched title link. Context: url, title. The row layout leaves a narrow
column beside its icon, so a word wider than the column breaks rather than running
out of the card.{% endcomment %}
<h3 class="wrap-break-word">
    <a href="{{ url }}"
       class="text-inherit no-underline before:absolute before:inset-0 before:content-[''] focus:outline-none">
        {{ title }}
    </a>
</h3>
