{% if has_reference %}
    <div class="mt-6">
        <a href="{% url 'learner_interface:course_reference' course_slug=course.slug %}"
           {% if is_current %}aria-current="page"{% endif %}
           class="flex items-center gap-2 text-sm no-underline {% if is_current %}bg-primary/10 -mx-1 px-1 rounded font-semibold text-on-surface{% else %}text-muted hover:text-primary{% endif %}">
            <c-icon name="reference" class="size-4" />
            Reference
        </a>
    </div>
{% endif %}
