{% extends "_base.html" %}

{% load static %}

{% block extra_alpine_components %}
    <script defer src="{% static 'learner_interface/js/alpine-components.js' %}"></script>
{% endblock extra_alpine_components %}

{% block head_title %}
    Revision: {{ course.title }}
{% endblock head_title %}

{% block content %}
    <c-page width="narrow">
        <div class="space-y-6">
            <c-back-link href="{% url 'learner_interface:course_detail' course_slug=course.slug %}">Back to course</c-back-link>
            {% include card_template %}
        </div>
    </c-page>
{% endblock content %}
