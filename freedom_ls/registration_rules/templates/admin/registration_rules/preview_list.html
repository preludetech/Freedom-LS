{% if entries %}
    {% if can_view_learners %}
        <ul class="mt-2 flex flex-col gap-1">
            {% for learner in entries %}
                <li>{{ learner.user.display_name }} ({{ learner.user.email }})</li>
            {% endfor %}
        </ul>
    {% endif %}
{% else %}
    <p class="mt-2">Nobody</p>
{% endif %}
