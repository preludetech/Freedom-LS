{% if entries %}
    {% if can_view_learners %}
        <ul class="mt-2 flex flex-col gap-1">
            {% for person in entries %}
                <li>{{ person.display_name }} ({{ person.email }})</li>
            {% endfor %}
        </ul>
    {% endif %}
{% else %}
    <p class="mt-2">Nobody</p>
{% endif %}
