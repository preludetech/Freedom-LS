{% if reasons %}
    {% if can_view_learners %}
        <ul class="mt-2 flex flex-col gap-1">
            {% for person, reason in reasons %}
                <li>{{ person.display_name }} ({{ person.email }}): {{ reason }}</li>
            {% endfor %}
        </ul>
    {% endif %}
{% else %}
    <p class="mt-2">Nobody</p>
{% endif %}
