<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Direct messages — working prototype</title>
<link rel="stylesheet" href="design-system/kit.css" />
<link rel="stylesheet" href="uc/uc.css" />
<link rel="stylesheet" href="dm/dm.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="uc/uc-data.jsx"></script>
<script type="text/babel" src="uc/uc-shell.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="dm/dm-store.jsx"></script>
<script type="text/babel" src="dm/dm-ui.jsx"></script>
<script type="text/babel" src="dm/dm-app.jsx"></script>
<script type="text/babel">
const DM_DEFAULTS = /*EDITMODE-BEGIN*/{
  "viewer": "amara",
  "viewport": "fit",
  "learnerStart": "none",
  "adaAmara": true,
  "autoReply": true,
  "poll": 5
}/*EDITMODE-END*/;

function Root() {
  const [t, setTweak] = useTweaks(DM_DEFAULTS);
  React.useEffect(() => { DMServer.setLearnerStart(t.learnerStart); }, [t.learnerStart]);
  React.useEffect(() => { DMServer.setRevoked("ada", "amara", !t.adaAmara); }, [t.adaAmara]);
  const incoming = () => {
    const ps = DMServer.partners(t.viewer); if (!ps.length) return;
    const from = ps[Math.floor(Math.random() * ps.length)], pool = DM_REPLIES[from] || ["Hello!"];
    DMServer.inject(from, t.viewer, pool[Math.floor(Math.random() * pool.length)]);
  };
  return (
    <>
      <div className={`dm-stage ${t.viewport === "375" ? "m" : ""}`}><DMApp t={t} /></div>
      <TweaksPanel title="Direct messages">
        <TweakSection label="Signed in as">
          <TweakSelect label="Viewer" value={t.viewer} onChange={(v) => setTweak("viewer", v)} options={[{value:"amara",label:"Amara Okafor · learner"},{value:"ada",label:"Ada Lovelace · instructor"},{value:"kat",label:"Katherine Johnson · learner"}]} />
          <TweakRadio label="Viewport" value={t.viewport} onChange={(v) => setTweak("viewport", v)} options={[{value:"fit",label:"Fit"},{value:"375",label:"375px"}]} />
        </TweakSection>
        <TweakSection label="MessagingPolicy">
          <TweakSelect label="Learners may start conversations with" value={t.learnerStart} onChange={(v) => setTweak("learnerStart", v)} options={[{value:"none",label:"No one (default)"},{value:"educators",label:"Their educators"},{value:"peers",label:"Educators and peers"}]} />
          <TweakToggle label="Ada ↔ Amara permitted" value={t.adaAmara} onChange={(v) => setTweak("adaAmara", v)} />
        </TweakSection>
        <TweakSection label="Delivery">
          <TweakToggle label="Other person replies" value={t.autoReply} onChange={(v) => setTweak("autoReply", v)} />
          <TweakSlider label="Poll every" value={t.poll} min={2} max={20} unit="s" onChange={(v) => setTweak("poll", v)} />
          <TweakButton label="Receive a message" onClick={incoming} />
          <TweakButton label="Next send: network error" secondary onClick={() => DMServer.armFailure("network")} />
          <TweakButton label="Next send: response lost" secondary onClick={() => DMServer.armFailure("lost")} />
        </TweakSection>
        <TweakSection label="Server log"><DMLog /></TweakSection>
      </TweaksPanel>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
