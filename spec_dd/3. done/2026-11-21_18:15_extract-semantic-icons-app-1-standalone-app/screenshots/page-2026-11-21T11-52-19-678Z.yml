                    - paragraph:
                      - strong: Authentication
                      - text: confirms identity — it answers "who are you?". A password, a token, or a certificate authenticates a user.
                    - paragraph:
                      - strong: Authorisation
                      - text: confirms permission — it answers "what are you allowed to do?". A role, a policy, or a capability list authorises an action.
                    - paragraph: Authentication comes first. Authorisation is meaningless without it.
                    - generic [aria-hidden]: Tap to flip
            - paragraph [ref=f3e237]: An answer face can hold anything markdown can express. The face is a tinted panel rather than the plain page surface, so every kind of prose on it — headings, links, inline and fenced code, tables, rules — is repainted to stay legible against the tint.
            - paragraph [ref=f3e238]:
