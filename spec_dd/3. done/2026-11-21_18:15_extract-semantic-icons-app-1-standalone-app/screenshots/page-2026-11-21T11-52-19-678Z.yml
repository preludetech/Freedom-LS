                  - text: Test the rollback path before deploying to production.
            - heading "Title override" [level=4] [ref=f3e202]
            - paragraph [ref=f3e203]:
              - text: Any admonition type accepts a
              - code [ref=f3e204]: title
              - text: attribute that replaces the default label. Use it when the generic label is too broad for the specific content.
            - note "A note about task lists" [ref=f3e205]:
              - paragraph [ref=f3e212]:
                - text: The
                - code [ref=f3e213]: checklist
                - text: type renders its body through the normal markdown pipeline, so
                - code [ref=f3e214]: "- [ ]"
                - text: items become accessible checkbox inputs. Do not use a checklist for items that will actually be ticked — it is a reading aid, not a form.
