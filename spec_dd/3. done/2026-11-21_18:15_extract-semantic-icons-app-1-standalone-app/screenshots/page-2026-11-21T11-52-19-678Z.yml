            - heading "Admonitions" [level=3] [ref=f3e104]
            - paragraph [ref=f3e105]: "An admonition draws the learner's eye to a passage that needs more weight than bold text can carry — a safety warning, a procedural tip, a regulatory constraint, or a list of things to check before moving on. Each type has a distinct colour and icon so learners build an intuition for what each shape means. Use them deliberately: a page full of admonitions has no admonitions."
            - paragraph [ref=f3e106]:
              - text: The
              - code [ref=f3e107]: type
              - text: attribute selects the style. The optional
              - code [ref=f3e108]: title
              - text: attribute overrides the default label. The body is rendered as markdown, so you can include lists, code, and emphasis.
            - heading "Note" [level=4] [ref=f3e109]
            - paragraph [ref=f3e110]:
              - text: Use
              - code [ref=f3e111]: note
              - text: for neutral, informational context that is worth flagging but carries no risk.
            - note "Note" [ref=f3e112]:
              - paragraph [ref=f3e119]:
                - text: A
                - code [ref=f3e120]: note
                - text: sits quietly alongside the main content. It adds context without implying any urgency.
            - heading "Tip" [level=4] [ref=f3e121]
            - paragraph [ref=f3e122]:
              - text: Use
              - code [ref=f3e123]: tip
              - text: for practical shortcuts, best practices, or things a more experienced person would tell you.
            - note "Tip" [ref=f3e124]:
              - paragraph [ref=f3e131]: Keyboard shortcuts pay back the time spent learning them many times over. Start with the three you reach for most, then build from there.
            - heading "Important" [level=4] [ref=f3e132]
            - paragraph [ref=f3e133]:
              - text: Use
              - code [ref=f3e134]: important
              - text: when the learner genuinely must not miss something — but save it for content that warrants the visual weight.
            - note "Important" [ref=f3e135]:
              - paragraph [ref=f3e142]: Always read the full error message before searching for it. The exact wording often contains the file path and line number that make the cause immediately clear.
            - heading "Warning" [level=4] [ref=f3e143]
            - paragraph [ref=f3e144]:
              - text: Use
              - code [ref=f3e145]: warning
              - text: when an action is reversible only with effort, or when a misunderstanding could waste significant time.
            - note "Warning" [ref=f3e146]:
              - paragraph [ref=f3e153]:
                - text: Renaming a database column requires a migration. Running
                - code [ref=f3e154]: makemigrations
                - text: is not enough — you must also run
                - code [ref=f3e155]: migrate
                - text: before restarting the server, or queries against the renamed column will fail at runtime.
            - heading "Danger" [level=4] [ref=f3e156]
            - paragraph [ref=f3e157]:
              - text: Use
              - code [ref=f3e158]: danger
              - text: when an action is irreversible or could cause data loss, a security breach, or a production outage.
            - note "Danger" [ref=f3e159]:
              - paragraph [ref=f3e166]:
                - text: Running
                - code [ref=f3e167]: DROP TABLE
                - text: without a transaction and a verified backup is irreversible. There is no undo. Always confirm you are connected to the correct database before executing destructive SQL.
            - heading "Key Takeaways" [level=4] [ref=f3e168]
            - paragraph [ref=f3e169]:
              - text: Use
              - code [ref=f3e170]: key_takeaways
              - text: at the end of a section to distil the three or four points every learner must leave with.
            - note "Key Takeaways" [ref=f3e171]:
              - list [ref=f3e178]:
                - listitem [ref=f3e179]: Admonitions guide attention — they cannot replace clear prose.
                - listitem [ref=f3e180]: Each type has a fixed meaning; mixing them up trains learners to ignore them.
                - listitem [ref=f3e181]: One or two admonitions per topic is usually enough.
            - heading "Checklist" [level=4] [ref=f3e182]
            - paragraph [ref=f3e183]:
              - text: Use
              - code [ref=f3e184]: checklist
              - text: for a concrete list of things to do or verify. The body is a markdown task list — each item uses
              - code [ref=f3e185]: "- [ ]"
              - text: syntax.
            - note "Checklist" [ref=f3e186]:
              - list [ref=f3e193]:
