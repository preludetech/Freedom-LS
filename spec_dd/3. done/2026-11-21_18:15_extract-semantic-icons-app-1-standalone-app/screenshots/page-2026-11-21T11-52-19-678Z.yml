              - generic [ref=f3e300]:
                - paragraph [ref=f3e301]: "Use an accordion when the content is:"
                - list [ref=f3e302]:
                  - listitem [ref=f3e303]: Optional supplementary material that benefits some learners but not all.
                  - listitem [ref=f3e304]: Reference information (a table, a list of options) that a learner may want to look up but does not need to read linearly.
                  - listitem [ref=f3e305]: A worked example that extends a concept already explained in the main flow.
                - paragraph [ref=f3e306]: Use a callout (admonition) instead when the content must be noticed — a warning, a constraint, or a key takeaway. Hiding required information behind a click is an accessibility and instructional design problem, not just a layout choice.
