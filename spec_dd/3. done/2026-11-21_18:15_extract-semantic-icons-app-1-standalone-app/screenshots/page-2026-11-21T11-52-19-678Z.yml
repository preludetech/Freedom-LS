            - heading "Accordion" [level=3] [ref=f3e279]
            - paragraph [ref=f3e280]: An accordion hides content behind a clickable summary bar. Click the bar to reveal or conceal the body. Use accordions for supplementary depth — optional context, reference tables, or worked examples that not every learner needs. Do not hide content that is required reading or that forms part of assessed material.
