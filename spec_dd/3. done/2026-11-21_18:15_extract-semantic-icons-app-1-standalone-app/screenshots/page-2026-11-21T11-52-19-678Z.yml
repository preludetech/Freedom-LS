            - note "Regulation" [ref=f3e221]:
              - paragraph [ref=f3e228]: Under POPIA, personal information may only be processed for the specific purpose for which it was collected. Learners must be informed of that purpose at the point of collection, and data may not be retained beyond what is necessary to fulfil it.
            - separator [ref=f3e229]
            - heading "Flashcard" [level=3] [ref=f3e230]
            - paragraph [ref=f3e231]: "A flashcard presents two faces — a prompt on the front and an answer on the back. Click anywhere on the card to flip it. Use flashcards for recall practice: vocabulary, definitions, formulae, or cause-and-effect relationships. Do not use them for content that must be read in full — hidden content is not assessable."
            - paragraph [ref=f3e232]: Each face is a named slot, so both sides support full markdown.
            - generic [ref=f3e234]:
