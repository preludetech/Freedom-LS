          - heading "Annotated diagrams" [level=3] [ref=f33e91]
          - paragraph [ref=f33e92]:
            - text: "There is no special \"diagram\" widget. An annotated diagram is an authoring pattern: a picture whose image carries visible letter markers, followed immediately by a"
