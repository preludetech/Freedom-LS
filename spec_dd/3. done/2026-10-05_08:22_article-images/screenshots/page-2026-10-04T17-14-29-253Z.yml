              - text: folder, the same way
              - code [ref=f29e102]: c-picture
              - text: works),
              - code [ref=f29e103]: alt
              - text: describes that image for screen-reader users, and
              - code [ref=f29e104]: title
              - text: sets the heading shown above the body. The
              - code [ref=f29e105]: size
              - text: attribute —
              - code [ref=f29e106]: small
              - text: ","
              - code [ref=f29e107]: medium
              - text: (the default), or
              - code [ref=f29e108]: large
              - text: — sets how wide the card is and how tall its header image renders. All four attributes are optional. The body is rendered as markdown.
            - paragraph [ref=f29e109]: Cards are centred and deliberately narrower than the content column so they read as a self-contained panel rather than a full-width block. The header image is cropped to a fixed height, so cards of the same size line up regardless of the source image's proportions.
            - heading "Header image, title, and body" [level=4] [ref=f29e110]
            - paragraph [ref=f29e111]:
              - text: "The full form: an image across the top, a heading, and a markdown body beneath. This one is"
              - code [ref=f29e112]: size="large"
              - text: — use the large size to feature a card you want to draw the eye to.
