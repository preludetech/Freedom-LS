            - heading "Card" [level=3] [ref=f29e96]
            - paragraph [ref=f29e97]: A card groups a passage of content into a self-contained, bordered panel. It can carry a header image across the top, an optional title, and a markdown body. Use a card to set a block of content apart from the surrounding flow — a worked example, a profile, a featured concept — when you want it to read as one unit rather than disappear into the page.
            - paragraph [ref=f29e98]: "A card is static: unlike an accordion it hides nothing, and unlike an admonition it carries no fixed meaning or colour. Reach for it when the grouping itself is the point."
            - paragraph [ref=f29e99]:
              - text: The
              - code [ref=f29e100]: src
              - text: attribute sets a header image (resolved from the topic's
