            - heading "Pictures" [level=3] [ref=f26e105]
            - paragraph [ref=f26e106]:
              - text: The picture widget renders an image with an accessible lightbox — click or focus it and press Enter to view it full-screen. The
              - code [ref=f26e107]: src
              - text: "is a path relative to this file. Three text attributes matter, and they do different jobs:"
            - list [ref=f26e108]:
              - listitem [ref=f26e109]:
                - code [ref=f26e110]: alt
                - text: describes the image for people who cannot see it. It is read by screen readers and never shown on screen.
              - listitem [ref=f26e111]:
                - code [ref=f26e112]: title
                - text: is the visible text printed under the image in the page and as the heading in the full-screen lightbox.
              - listitem [ref=f26e113]:
                - code [ref=f26e114]: description
                - text: (optional) adds a longer caption block below the title, both in the page and in the full-screen lightbox — useful for detailed annotations that do not fit in a one-line title.
            - paragraph [ref=f26e115]:
              - text: Do not duplicate
              - code [ref=f26e116]: alt
              - text: and
              - code [ref=f26e117]: title
              - text: . The alt text should stand in for the image; the title adds context a sighted reader still benefits from. Purely decorative images should use
              - code [ref=f26e118]: alt=""
              - text: so screen readers skip them.
            - paragraph [ref=f26e119]:
              - text: Add a
              - code [ref=f26e120]: number
              - text: "to prefix the title with \"Figure N\":"
            - figure "Figure 1 A titled, numbered figure with a click-to-zoom lightbox, and a really long title Expand This longer description sits below the title in the page, and appears again beneath the title in the full-screen lightbox." [ref=f26e122]:
