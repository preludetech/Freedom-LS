            - heading "Annotated diagrams" [level=3] [ref=f26e134]
            - paragraph [ref=f26e135]:
              - text: "There is no special \"diagram\" widget. An annotated diagram is an authoring pattern: a picture whose image carries visible letter markers, followed immediately by a"
              - code [ref=f26e136]: <dl>
              - text: legend that says what each letter means. This matters for accessibility — colour and position alone are never the only signal, so a screen-reader user gets the same information from the legend that a sighted user gets from the picture.
